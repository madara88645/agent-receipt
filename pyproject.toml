[project]
name = "agent-receipt"
version = "0.1.0"
description = "A receipt for your Claude Code subagents: who spawned whom, which model actually ran, what it cost, and which rules were broken."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "Mehmet Özel" }]
keywords = ["claude-code", "subagents", "tokens", "audit", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/madara88645/agent-receipt"

[project.scripts]
agent-receipt = "agent_receipt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_receipt"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
